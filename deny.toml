# cargo-deny configuration for the Signer workspace.
# Run: `cargo deny check` (also wired into CI / Justfile).
# Layout mirrors kobe/deny.toml for a consistent qntx policy surface.

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
# When the optional `kobe` feature is enabled, alloy-primitives 1.6.1 pulls
# ruint 1.17.x (RUSTSEC-2026-0220). Same rationale as kobe: the signer path
# that uses kobe is key material only; alloy is not used for untrusted
# checked-shift formatting. Revisit when alloy-primitives upgrades ruint.
ignore = [
    { id = "RUSTSEC-2026-0220", reason = "ruint pinned by alloy-primitives 1.6.1 via optional kobe-evm; not on pure signer signing path" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitive of alloy-primitives (kobe feature only)" },
]

[licenses]
confidence-threshold = 0.8
allow                = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-1-Clause",
    "CC0-1.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
]

[licenses.private]
ignore = false

[bans]
multiple-versions          = "warn"
wildcards                  = "deny"
highlight                  = "all"
workspace-default-features = "allow"
external-default-features  = "allow"
allow-workspace            = true

# Keep the workspace free of the full bitcoin protocol stack. Bitcoin
# message signing uses k256 + sha2 (+ local CompactSize); addresses/WIF
# belong in kobe-btc. Do not reintroduce `bitcoin` as a direct or optional
# workspace dependency.
deny = [
    { crate = "bitcoin", reason = "signer-btc must not pull the full bitcoin crate; use k256 + workspace hashes" },
]

# Dual RustCrypto lines until bip32 0.5 / k256 0.13 and ed25519-dalek 3 /
# workspace sha2 0.11 align on one digest generation.
skip = [
    { crate = "sha2@0.10", reason = "pulled by k256 0.13 / bip32 path; workspace uses sha2 0.11" },
    { crate = "hmac@0.12", reason = "pulled by k256 ecdsa path; workspace uses hmac 0.13 when present" },
    { crate = "digest@0.10", reason = "RustCrypto 0.10 line via k256 / blake2 0.10; ed25519-dalek 3 uses digest 0.11" },
    { crate = "block-buffer@0.10", reason = "companion of digest 0.10 via k256; digest 0.11 pulls block-buffer 0.12" },
    { crate = "crypto-common@0.1", reason = "digest 0.10 stack; workspace digest 0.11 line coexists until k256 upgrades" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
