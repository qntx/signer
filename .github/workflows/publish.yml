name: Publish to crates.io

on:
  push:
    tags: ["v*.*.*"]

jobs:
  publish:
    uses: qntx/workflows/.github/workflows/publish-crates.yml@main
    with:
      # primitives → chains (incl. arweave) → umbrella → CLI
      packages: "signer-primitives signer-aptos signer-arweave signer-btc signer-casper signer-cosmos signer-evm signer-fil signer-nostr signer-spark signer-sui signer-svm signer-ton signer-tron signer-xrpl signer signer-cli"
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
