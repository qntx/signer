[package]
name                   = "signer-casper"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
readme                 = "../../README.md"
description            = "Casper Network signer — dual-curve ECDSA / Ed25519 over deploy digests."
keywords               = ["crypto", "signer", "casper", "cspr", "no_std"]
categories             = ["cryptography::cryptocurrencies", "no-std"]

[features]
default   = ["std"]
std       = ["alloc", "signer-primitives/std"]
alloc     = ["signer-primitives/alloc"]
getrandom = ["signer-primitives/getrandom"]
kobe      = ["dep:kobe-casper", "signer-primitives/kobe"]

[dependencies]
signer-primitives = { workspace = true, features = ["secp256k1", "ed25519"] }
hex.workspace     = true

kobe-casper = { workspace = true, optional = true }

[dev-dependencies]
signer-primitives = { workspace = true, features = ["testing", "secp256k1", "ed25519"] }
hex.workspace     = true

[lints]
workspace = true
